apiVersion: 1

datasources:
  - name: ChargeSplit
    uid: chargesplit
    type: grafana-postgresql-datasource
    url: db:5432
    user: chargesplit_reader          # read-only role created by the collector
    access: proxy
    isDefault: true
    editable: false
    secureJsonData:
      password: $CHARGESPLIT_READER_PASSWORD
    jsonData:
      database: chargesplit
      sslmode: disable
      postgresVersion: 1700
